# Early warning for NetBird releases: once a week, run the acceptance suite
# against the newest NetBird release while go.mod still pins an older one. A
# break shows up here, as an issue labelled netbird-latest, before anyone bumps
# the dependency or upgrades a server. When the suite passes again, the issue
# is closed with a note.
name: NetBird latest

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  resolve:
    name: Resolve versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      latest: ${{ steps.versions.outputs.latest }}
      pinned: ${{ steps.versions.outputs.pinned }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/netbirdio/netbird/releases/latest --jq .tag_name)
          pinned=$(awk '$1 == "github.com/netbirdio/netbird" { print $2; exit }' go.mod)
          for v in "$latest" "$pinned"; do
            if ! printf '%s' "$v" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "::error::unexpected version: $v"
              exit 1
            fi
          done
          echo "pinned $pinned, latest release $latest"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"

  e2e:
    name: Against the latest release
    needs: resolve
    # The pinned version is tested on every pull request and push already.
    if: needs.resolve.outputs.latest != needs.resolve.outputs.pinned
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/e2e.yml
    with:
      netbird_version: ${{ needs.resolve.outputs.latest }}

  report:
    name: Report
    needs: [resolve, e2e]
    if: always() && needs.e2e.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.e2e.result }}
          LATEST: ${{ needs.resolve.outputs.latest }}
          PINNED: ${{ needs.resolve.outputs.pinned }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Acceptance suite fails against NetBird $LATEST"
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --label netbird-latest --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ "$RESULT" = success ]; then
            echo "passes against $LATEST"
            if [ -n "$open" ]; then
              gh issue close "$open" -R "$GITHUB_REPOSITORY" --comment "Passes again: $RUN_URL"
            fi
            exit 0
          fi
          if [ -n "$open" ]; then
            gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "Still failing: $RUN_URL"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --label netbird-latest --title "$title" --body \
              "The weekly run of the acceptance suite against NetBird $LATEST failed ($RESULT); go.mod pins $PINNED.

          Run: $RUN_URL

          Find what changed in NetBird, fix the provider or record the incompatibility, and bump the dependency (see the compatibility policy in the README)."
          fi
